<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>block: chat</title>
<link href="../../../_runtime/fonts/fonts.css" rel="stylesheet">
<link href="../core/core.css" rel="stylesheet">
<link href="../chat/chat.css" rel="stylesheet">
<style>
  html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: var(--cream); }
  #stage { position: relative; width: 100%; height: 100%; color: var(--ink); font-family: var(--font); }
  .box { position: absolute; }
  .top { left: 80px; top: 120px; width: 920px; height: 780px; }
  .bot { left: 80px; top: 1000px; width: 920px; height: 780px; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-fps="30">
  <div class="box top"></div>
  <div class="box bot"></div>
</div>
<script src="../../../brands/videofactory/tokens.js"></script>
<script src="../../../_runtime/vendor/gsap.min.js"></script>
<script src="../_demo/cues.js"></script>
<script src="../../../_runtime/hf-bridge.js"></script>
<script src="../core/core.js"></script>
<script src="../chat/chat.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  const H = Blocks.core(tl);
  const q = s => document.querySelector(s);
  const a = Blocks.chat(H, q(".top"), { variant: "dark" });
  a.center(0);
  a.typeInto("Write copy for my website. ", 0.1, 0.6);
  const wish = a.typeInto("Make no mistakes.", 0.6, 1.0, { hot: true });
  a.dock(1.4); a.hideHello(1.4);
  const m = a.sendTo(1.4, "Write copy for my website.", { struck: "Make no mistakes." });
  a.answer("Tell me what your website is about and who you write for.", 1.8, 2.6);
  a.strike(m.struck, 2.8);
  const b = Blocks.chat(H, q(".bot"), { variant: "light" });
  b.typeInto("Write a short, friendly email to my customer.", 0.2, 1.2);
  b.quote("Hi Sam, good news: your order is on its way.", 1.4);
  tl.set(q("#stage"), { autoAlpha: 1 }, window.ANIM.meta.duration);  // timeline as long as the demo
  window.__timelines["main"] = tl;
</script>
</body>
</html>

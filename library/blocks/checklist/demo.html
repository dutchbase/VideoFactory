<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>block: checklist</title>
<link href="../../../_runtime/fonts/fonts.css" rel="stylesheet">
<link href="../core/core.css" rel="stylesheet">
<link href="../checklist/checklist.css" rel="stylesheet">
<style>
  html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: var(--cream); }
  #stage { position: relative; width: 100%; height: 100%; color: var(--ink); font-family: var(--font); }
  .box { position: absolute; }
  .row { left: 80px; top: 900px; width: 920px; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-fps="30">
  <div class="box row"></div>
</div>
<script src="../../../brands/videofactory/tokens.js"></script>
<script src="../../../_runtime/vendor/gsap.min.js"></script>
<script src="../_demo/cues.js"></script>
<script src="../../../_runtime/hf-bridge.js"></script>
<script src="../core/core.js"></script>
<script src="../checklist/checklist.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  const H = Blocks.core(tl);
  const q = s => document.querySelector(s);
  const v = Blocks.checklist(H, q(".row"), { items: ["33 words", "you-form", "ends with a question"] });
  v.show(0.5);
  tl.set(q("#stage"), { autoAlpha: 1 }, window.ANIM.meta.duration);  // timeline as long as the demo
  window.__timelines["main"] = tl;
</script>
</body>
</html>

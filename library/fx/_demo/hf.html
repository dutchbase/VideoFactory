<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fx demo (HyperFrames)</title>
<link href="../../../_runtime/fonts/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; overflow: hidden; background: var(--cream); }
  #stage { position: relative; overflow: hidden; background: var(--cream); color: var(--ink); font-family: var(--font); }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-fps="30"></div>
<script src="../../../brands/videofactory/tokens.js"></script>
<script src="../../../_runtime/vendor/gsap.min.js"></script>
<script src="cues.js"></script>
<script src="../../../_runtime/hf-bridge.js"></script>
<script src="parts.js"></script>
<script src="load.js"></script>
<script>
  const st = FXDemo.stage;
  st.style.width = st.dataset.width + "px"; st.style.height = st.dataset.height + "px";
  FXDemo.load().then(() => {
    const tl = gsap.timeline({ paused: true });
    const H = Blocks.core(tl);
    window.FX_DEMO(H, st);
    tl.set(st, { autoAlpha: 1 }, FXDemo.duration());  // timeline as long as the demo
    window.__timelines["main"] = tl;
    return document.fonts.ready.then(() => { tl.seek(0); window.__fxReady = true; });  // as a render: fonts first
  }).catch(e => { window.__fxError = String(e); throw e; });
</script>
</body>
</html>

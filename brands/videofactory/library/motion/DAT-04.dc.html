<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_runtime/fonts/fonts.css">
<script src="./image-slot.js"></script>
<link rel="stylesheet" href="./motion.css">
<style>
body{margin:0;background:var(--vf-bg);}
a{color:var(--vf-ink);}a:hover{color:var(--vf-accent);}
</style>
</helmet>
<div ref="{{ rootRef }}" style="font-family:var(--vf-head);color:var(--vf-ink);background:var(--vf-bg);padding:40px;display:flex;flex-direction:column;gap:32px;">
<sc-if value="{{ showBar }}" hint-placeholder-val="{{ false }}">

<div style="display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;">

<label style="display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;">DURATION <input type="number" min="1" max="60" step="0.5" value="{{ p.dur }}" onChange="{{ onDur }}" style="width:64px;background:var(--vf-bg);color:var(--vf-ink);border:2px solid var(--vf-ink);padding:6px 8px;font-family:var(--vf-mono);font-size:12px;font-weight:700;"> SEC</label>
<button onClick="{{ toggleOut }}" style="background:var(--vf-bg);color:var(--vf-ink);border:2px solid var(--vf-ink);padding:7px 12px;font-family:var(--vf-mono);font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer;" style-hover="background:var(--vf-ink);color:var(--vf-bg);">{{ outLabel }}</button>
<button onClick="{{ toggleTr }}" style="background:var(--vf-bg);color:var(--vf-ink);border:2px solid var(--vf-ink);padding:7px 12px;font-family:var(--vf-mono);font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer;" style-hover="background:var(--vf-ink);color:var(--vf-bg);">{{ trLabel }}</button>
<div style="margin-left:auto;display:flex;align-items:center;gap:10px;"><span style="font-size:11px;letter-spacing:.08em;color:var(--vf-accent);">{{ copyMsg }}</span><button onClick="{{ copyUrl }}" style="background:var(--vf-accent);color:var(--vf-on-accent);border:2px solid var(--vf-accent);padding:7px 12px;font-family:var(--vf-mono);font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer;" style-hover="background:var(--vf-ink);border-color:var(--vf-ink);">COPY RENDER URL</button></div>
</div>
<div style="display:flex;gap:10px;align-items:center;">
<button onClick="{{ toStart }}" style="background:var(--vf-bg);color:var(--vf-ink);border:2px solid var(--vf-ink);padding:7px 12px;font-family:var(--vf-mono);font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer;width:40px;padding:7px 0;" aria-label="Go to start">|◀</button>
<button onClick="{{ stepBack }}" style="background:var(--vf-bg);color:var(--vf-ink);border:2px solid var(--vf-ink);padding:7px 12px;font-family:var(--vf-mono);font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer;width:40px;padding:7px 0;" aria-label="Previous frame">−1</button>
<button onClick="{{ togglePlay }}" style="background:var(--vf-accent);color:var(--vf-on-accent);border:2px solid var(--vf-accent);width:92px;padding:7px 0;font-family:var(--vf-mono);font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer;">{{ playLabel }}</button>
<button onClick="{{ stepFwd }}" style="background:var(--vf-bg);color:var(--vf-ink);border:2px solid var(--vf-ink);padding:7px 12px;font-family:var(--vf-mono);font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer;width:40px;padding:7px 0;" aria-label="Next frame">+1</button>
<span ref="{{ timeRef }}" style="width:190px;font-size:13px;letter-spacing:.06em;text-align:right;white-space:nowrap;"></span>
<div ref="{{ trackRef }}" onPointerDown="{{ onScrub }}" style="position:relative;flex:1;height:34px;border:2px solid var(--vf-ink);cursor:ew-resize;touch-action:none;">

</div>
</div>
<div style="font-size:11px;letter-spacing:.06em;color:var(--vf-dim);overflow-wrap:anywhere;">{{ apiHint }}</div>
</div>
</sc-if>
<section style="display:flex;flex-direction:column;gap:28px;">

<div id="DAT-04" style="display:flex;flex-direction:column;gap:12px;">

</div>
</div>
</section>
</div>
</x-dc>

    r.querySelectorAll('[data-clock-down]').forEach(el => { const v = Math.max(0, (+el.dataset.clockDown) - Math.max(0, t - (+el.dataset.start || 0))); const s = Math.floor(v / 60) + ':' + (v % 60).toFixed(1).padStart(4, '0'); if (el.textContent !== s) el.textContent = s; });
    const beat = Math.exp(-((t % .5) * 7));
    r.querySelectorAll('[data-eq]').forEach(el => { const i = +el.dataset.eq; const v = 8 + 92 * Math.abs(Math.sin(t * 3.1 + i * .55) * Math.cos(t * 1.7 + i * .23)) * (.55 + .45 * beat); el.style.height = v.toFixed(1) + '%'; });
    r.querySelectorAll('[data-beat]').forEach(el => { el.style.transform = 'scale(' + (1 + .14 * beat).toFixed(3) + ')'; });
    r.querySelectorAll('[data-clock]').forEach(el => { const v = (+el.dataset.base || 0) + Math.max(0, t - (+el.dataset.start || 0)); const s = Math.floor(v / 60) + ':' + String(Math.floor(v % 60)).padStart(2, '0'); if (el.textContent !== s) el.textContent = s; });
    const pad = n => String(n).padStart(2, '0');
    const tt = real != null ? real * 1000 : (this.T % 6000);
    const f = Math.floor(tt / 40);
    const tc = '00:00:' + pad(Math.floor(f / 25) % 60) + ':' + pad(f % 25);
    r.querySelectorAll('[data-timecode]').forEach(el => { if (el.textContent !== tc) el.textContent = tc; });
  }
  renderVals() {
    const mk = a => a.map(([w, s, e, k]) => ({ w, s, e, key: !!k, plain: !k }));
    const voA = mk([['Every', .3, .55], ['week', .55, .95], ['you', .95, 1.2], ['spend', 1.2, 1.5], ['10', 1.5, 1.8, 1], ['hours', 1.8, 2.15, 1], ['on', 2.15, 2.4], ['email.', 2.4, 3.0, 1]]);
    const tokens = ['AI','tool','s','work','best','when','you','tell','it','pre','cise','ly','what','you','want','to','ach','ie','ve','.'].map((w, i, all) => ({ w, s: +(.4 + i * .12).toFixed(2), e: +(.4 + i * .12 + (i === all.length - 1 ? .8 : .12)).toFixed(2) }));
    const voB = mk([['AI', 3.1, 3.4, 1], ['does', 3.4, 3.7], ['it', 3.7, 3.95], ['in', 3.95, 4.15], ['10', 4.15, 4.5, 1], ['minutes.', 4.5, 5.5, 1]]);
    const aiSet = [1,6,8,12,17,19,23,26,28,31,35,38];
    const weekCells = Array.from({length:40},(_, i) => { const o = aiSet.indexOf(i); return { s: +(0.3 + Math.floor(i/5)*0.07 + (i%5)*0.03).toFixed(2), ai: o >= 0, a: +(2.0 + o*0.1).toFixed(2) }; });
    const F = [
      {key:'16:9',label:'16:9 · 1920×1080',w:480,h:270,tall:false,notTall:true,arrow:'→',wide:true,notWide:false,flow:'row',agentFlow:'row',cols4:'repeat(4,minmax(0,1fr))',nodeW:'30cqmin',nodeH:'20cqmin',nodeFont:'3.6cqmin',phoneH:'150cqh',phoneTop:'14cqh'},
      {key:'9:16',label:'9:16 · 1080×1920',w:270,h:480,tall:true,notTall:false,arrow:'↓',wide:false,notWide:true,flow:'column',agentFlow:'column',cols4:'repeat(2,minmax(0,1fr))',nodeW:'60cqmin',nodeH:'15cqmin',nodeFont:'3.6cqmin',phoneH:'84cqh',phoneTop:'8cqh'},
      {key:'1:1',label:'1:1 · 1080×1080',w:360,h:360,tall:false,notTall:true,arrow:'→',wide:false,notWide:true,flow:'column',agentFlow:'row',cols4:'repeat(2,minmax(0,1fr))',nodeW:'20.5cqmin',nodeH:'24cqmin',nodeFont:'2.2cqmin',phoneH:'100cqh',phoneTop:'6cqh'}];
    const p = this.state.player;
    const fmt = this.props.format ?? 'All';
    const formats = fmt === 'All' ? F : F.filter(x => x.key === fmt);
    const fm = {};
    this.ASSETS.forEach(a => { const k = a.id.replace('-', '_'); fm[k] = p ? (a.id === p.asset ? F.filter(x => x.key === p.format) : []) : formats; });
    const res = p ? ({ '16:9': '1920×1080', '9:16': '1080×1920', '1:1': '1080×1080' }[p.format]) : '';
    const query = p ? '?asset=' + p.asset + '&format=' + p.format + '&dur=' + p.dur + (p.out ? '' : '&out=0') + (p.transparent ? '&transparent=1' : '') + '&clean=1' : '';
    const secTicks = p ? Array.from({ length: Math.floor(p.dur) + 1 }, (_, i) => ({ pct: +(i / p.dur * 100).toFixed(3), label: i + 's', last: i === Math.floor(p.dur), notLast: i !== Math.floor(p.dur) })) : [];
    return {
      formats, fm, weekCells, tokens, voA, voB, voAll: voA.concat(voB),
      rootRef: this.rootRef, selRef: this.selRef, timeRef: this.timeRef, fillRef: this.fillRef, headRef: this.headRef, trackRef: this.trackRef,
      showCaptions: p ? false : (this.props.showCaptions ?? true),
      showBar: !!(p && !p.clean), p: p || {},
      assetList: this.ASSETS.map(a => ({ id: a.id, label: a.id + ' · ' + a.name })),
      fmtButtons: ['16:9', '9:16', '1:1'].map(k => ({ key: k, active: !!p && p.format === k, inactive: !(p && p.format === k) })),
      secTicks, playLabel: this.state.playing ? '❚❚ PAUSE' : '▶ PLAY',
      outLabel: p && p.out ? 'EXIT ANIMATION: ON' : 'EXIT ANIMATION: OFF',
      copyMsg: this.state.copyMsg,
      trLabel: p && p.transparent ? 'TRANSPARENT: ON' : 'TRANSPARENT: OFF',
      toggleTr: () => this.setPlayer({ transparent: !(p && p.transparent) }),
      apiHint: p ? 'RENDER  ' + query + '   ·   window.smai.seek(sec)   ·   30 FPS   ·   ' + res + '   ·   SPACE / ← → / HOME' : '',
      openPlayer: (e) => { const id = e.currentTarget.dataset.asset; this.T = 0; this.playing = true; this.setState({ playing: true, copyMsg: '', player: { asset: id, format: (this.state.player || {}).format || '9:16', dur: 6, out: true, clean: false } }); window.scrollTo(0, 0); },
      closePlayer: () => { this.playing = true; this.setState({ player: null, playing: true }); },
      onAsset: (e) => { this.T = 0; this.setPlayer({ asset: e.target.value }); },
      setFormat: (e) => this.setPlayer({ format: e.currentTarget.dataset.key }),
      onDur: (e) => { const v = Math.max(1, Math.min(60, +e.target.value || 6)); this.setPlayer({ dur: v }); },
      toggleOut: () => this.setPlayer({ out: !(p && p.out) }),
      togglePlay: this.togglePlay,
      toStart: () => this.seek(0), stepBack: () => this.step(-1), stepFwd: () => this.step(1),
      onScrub: (e) => {
        const tr = this.trackRef.current; if (!tr || !p) return;
        const at = (x) => { const b = tr.getBoundingClientRect(); this.seek(Math.max(0, Math.min(1, (x - b.left) / b.width)) * p.dur); };
        at(e.clientX);
        const mv = (ev) => at(ev.clientX); const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
        window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
      },
      copyUrl: () => {
        const url = location.origin + location.pathname + query;
        const done = (m) => { this.setState({ copyMsg: m }); clearTimeout(this.cm); this.cm = setTimeout(() => this.setState({ copyMsg: '' }), 2500); };
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => done('COPIED'), () => done(query)); else done(query);
      }
    };
  }
}

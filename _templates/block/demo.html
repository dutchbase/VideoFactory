<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>block: <id></title>
<link href="../../../_runtime/fonts/fonts.css" rel="stylesheet">
<link href="core.css" rel="stylesheet">
<style>
  html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: var(--cream); }
  #stage { position: relative; width: 100%; height: 100%; color: var(--ink); font-family: var(--font); }
  .rail { position: absolute; left: 70px; top: 300px; width: 940px; font-family: var(--head); font-weight: 900; font-size: 96px; line-height: 0.96; text-transform: uppercase; }
  .typed { position: absolute; left: 80px; top: 800px; width: 920px; font-size: 48px; }
  .answer { position: absolute; left: 80px; top: 1000px; width: 920px; font-size: 40px; line-height: 1.4; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-fps="30">
  <div class="rail"></div><div class="typed"></div><div class="answer"></div>
</div>
<script src="../../../brands/videofactory/tokens.js"></script>
<script src="../../../_runtime/vendor/gsap.min.js"></script>
<script src="../_demo/cues.js"></script>
<script src="../../../_runtime/hf-bridge.js"></script>
<script src="core.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  const H = Blocks.core(tl);
  const q = s => document.querySelector(s);
  H.say(q(".rail"), 0, 8);
  H.type(H.chars(q(".typed"), "Write a short, "), 0.3, 1.2);
  H.type(H.chars(q(".typed"), "friendly email.", "b-hot"), 1.2, 2.0);
  H.stream(H.words(q(".answer"), "Hi Sam, good news: your order is on its way.\n\nAny questions?"), 2.2, 3.0);
  tl.set(q(".rail"), { autoAlpha: 1 }, window.ANIM.meta.duration);  // timeline as long as the demo
  window.__timelines["main"] = tl;
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="runtime/fonts/fonts.css">
<link rel="stylesheet" href="runtime/modern.css">
<link rel="stylesheet" href="runtime/image.css">
<style>
  /* Rules for this image only. Size with var(--u) (1/100 of the short side of the safe area), never with px.
     Layout classes on #stage: .is-avatar .is-banner .is-wide .is-square .is-portrait .is-tall */
</style>
</head>
<body>
<div id="stage" data-width="1080" data-height="1080">
  <div class="vf-bg"><div class="vf-glow"></div><div class="vf-glow two"></div></div>
  <!-- A full-bleed picture goes here, before the frame:
       <div data-bleed><img class="vf-picture" src="pictures/photo.jpg" alt=""><div class="vf-scrim"></div></div> -->
  <section class="vf-frame">
    <img class="vf-logo" src="brand/logo/mark.svg" alt="">
    <div class="vf-stack" data-hide="avatar">
      <div class="vf-kicker" data-brand="name"></div>
      <h1 class="vf-hero">{{TITLE}}</h1>
      <p class="vf-sub" data-hide="banner">One short line that says why it matters.</p>
    </div>
  </section>
</div>
<script src="runtime/image-size.js"></script>
<script src="brand/tokens.js"></script>
<script src="runtime/player.js"></script>
<script src="runtime/icons.js"></script>
<script src="runtime/modern.js"></script>
<script src="design.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>scene</title>
<link href="runtime/fonts/fonts.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
  #stage { position: relative; width: 100%; height: 100%; color: var(--ink); font-family: var(--font); }
  #title { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           font-family: var(--head); font-size: 96px; font-weight: 700; color: var(--ink); opacity: 0; }
</style>
</head>
<body>
<!-- TEMPLATE: starter scene. Stage 04 replaces it; anim.py status shows 04_scene as done after that. -->
<div id="stage" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-fps="30">
  <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="0">Title</h1>
  <audio id="voice" class="clip" data-start="0" data-track-index="1" src="voice/{{VOICE}}"></audio>
</div>
<script src="brand/tokens.js"></script>
<script src="runtime/vendor/gsap.min.js"></script>
<script src="cues/cues.js"></script>
<script src="runtime/hf-bridge.js"></script>
<script>
  // Scene: one paused timeline. Place every tween on a cue() time. Colors only via brand CSS vars.
  // Keep this script inline: `hyperframes lint` only sees the timeline registration in inline scripts.
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6 }, cue("intro"));
  window.__timelines["main"] = tl;
</script>
</body>
</html>

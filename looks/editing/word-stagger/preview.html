<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  .panel { background: var(--bg); }
  .t { position: absolute; font-family: var(--head); font-weight: 800; color: var(--ink); line-height: 1; white-space: nowrap; }
  .box { position: absolute; border-radius: 8px; background: var(--surface); outline: 1px solid var(--line); }
  .acc { background: var(--accent); }
  .ink { background: var(--ink); }
  .dim { background: color-mix(in srgb, var(--ink) 18%, transparent); }
  .streak { position: absolute; height: 5px; border-radius: 3px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 70%, transparent)); }
  .tag { position: absolute; left: 10px; bottom: 8px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .brand { position: absolute; right: 10px; bottom: 8px; font-family: var(--mono); font-size: 10px; color: var(--faint); }
</style></head>
<body>
<div class="strip">
  <div class="panel"><div class="t" style="left:30px;top:70px;font-size:34px;opacity:.4">Save</div><div class="t" style="left:140px;top:70px;font-size:34px;">10</div><div class="tag">word 1, 2</div><div class="brand" data-brand="name">name</div></div>
  <div class="panel"><div class="t" style="left:30px;top:70px;font-size:28px;opacity:.4">Save 10</div><div class="t" style="left:150px;top:55px;font-size:64px;color:var(--accent)">hours</div><div class="tag">key word pops</div><div class="brand" data-brand="name">name</div></div>
  <div class="panel"><div class="t" style="left:30px;top:50px;font-size:24px;opacity:.4">Save 10 hours</div><div class="t" style="left:30px;top:90px;font-size:40px;">a week.</div><div class="tag">phrase builds</div><div class="brand" data-brand="name">name</div></div>
</div>
<div class="scap">words arrive on the voice; the key word grows</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  .panel { background: var(--bg); }
  .t { position: absolute; font-family: var(--head); font-weight: 800; color: var(--ink); line-height: 1; white-space: nowrap; }
  .box { position: absolute; border-radius: 8px; background: var(--surface); outline: 1px solid var(--line); }
  .acc { background: var(--accent); }
  .ink { background: var(--ink); }
  .dim { background: color-mix(in srgb, var(--ink) 18%, transparent); }
  .streak { position: absolute; height: 5px; border-radius: 3px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 70%, transparent)); }
  .tag { position: absolute; left: 10px; bottom: 8px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .brand { position: absolute; right: 10px; bottom: 8px; font-family: var(--mono); font-size: 10px; color: var(--faint); }
</style></head>
<body>
<div class="strip">
  <div class="panel"><div class="box " style="left:20px;top:20px;width:320px;height:160px;"></div><div class="box acc" style="left:150px;top:75px;width:50px;height:45px;"></div><div class="t" style="left:30px;top:35px;font-size:16px;">Level 1</div><div class="tag">target in A</div><div class="brand" data-brand="name">name</div></div>
  <div class="panel"><div class="streak" style="left:0px;top:50px;width:100px;"></div><div class="box acc" style="left:60px;top:30px;width:260px;height:150px;filter:blur(3px);opacity:.8"></div><div class="tag">dive and blur</div><div class="brand" data-brand="name">name</div></div>
  <div class="panel"><div class="box acc" style="left:0px;top:0px;width:357px;height:201px;"></div><div class="box " style="left:120px;top:50px;width:120px;height:90px;"></div><div class="t" style="left:135px;top:85px;font-size:22px;">Level 2</div><div class="tag">B is the screen</div><div class="brand" data-brand="name">name</div></div>
</div>
<div class="scap">dive into the detail; it becomes the next scene</div>
</body></html>

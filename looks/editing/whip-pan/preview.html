<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  .panel { background: var(--bg); }
  .t { position: absolute; font-family: var(--head); font-weight: 800; color: var(--ink); line-height: 1; white-space: nowrap; }
  .box { position: absolute; border-radius: 8px; background: var(--surface); outline: 1px solid var(--line); }
  .acc { background: var(--accent); }
  .ink { background: var(--ink); }
  .dim { background: color-mix(in srgb, var(--ink) 18%, transparent); }
  .streak { position: absolute; height: 5px; border-radius: 3px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 70%, transparent)); }
  .tag { position: absolute; left: 10px; bottom: 8px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .brand { position: absolute; right: 10px; bottom: 8px; font-family: var(--mono); font-size: 10px; color: var(--faint); }
</style></head>
<body>
<div class="strip">
  <div class="panel"><div class="box " style="left:40px;top:50px;width:150px;height:100px;"></div><div class="t" style="left:60px;top:90px;font-size:30px;">Step 1</div><div class="tag">A: still</div><div class="brand" data-brand="name">name</div></div>
  <div class="panel"><div class="streak" style="left:0px;top:70px;width:200px;"></div><div class="streak" style="left:30px;top:100px;width:260px;"></div><div class="streak" style="left:0px;top:130px;width:180px;"></div><div class="box acc" style="left:150px;top:60px;width:140px;height:80px;filter:blur(4px);opacity:.55"></div><div class="tag">swing: cut hidden</div><div class="brand" data-brand="name">name</div></div>
  <div class="panel"><div class="box " style="left:170px;top:50px;width:150px;height:100px;"></div><div class="t" style="left:190px;top:90px;font-size:30px;">Step 2</div><div class="tag">B: lands</div><div class="brand" data-brand="name">name</div></div>
</div>
<div class="scap">still → swing and smear → lands</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">

<style>
  .t { left: 96px; top: 56px; font-family: var(--head); font-weight: 800; font-size: 46px; color: var(--ink); }
  .c { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; }
  .acc { border-color: var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 20%, transparent); }

  .mo { font-family: var(--mono); font-size: 16px; color: var(--faint); letter-spacing: .08em; text-transform: uppercase; }
  .pill { border-radius: 999px; background: var(--accent); color: var(--bg); font-family: var(--head); font-weight: 700; font-size: 22px; padding: 10px 26px; }
  .bar { height: 14px; border-radius: 7px; background: color-mix(in srgb, var(--ink) 14%, transparent); }
  .bar.a { background: var(--accent); }
  .big { font-family: var(--head); font-weight: 800; color: var(--accent); }

</div></body></html>

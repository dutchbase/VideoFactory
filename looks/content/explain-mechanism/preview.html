<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  .node { width: 200px; height: 110px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); display: grid; place-items: center;
    font-family: var(--head); font-weight: 700; font-size: 26px; color: var(--ink); }
  .node.on { border-color: var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent); }
  .node.dim { opacity: .5; }
  .num { position: absolute; top: -14px; left: -14px; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--bg); font-family: var(--mono); font-size: 16px; display: grid; place-items: center; }
  .q { left: 96px; top: 70px; font-family: var(--head); font-weight: 800; font-size: 48px; color: var(--ink); }
  .take { left: 96px; top: 600px; width: 1088px; padding: 22px 28px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 14%, var(--bg)); font-family: var(--font); font-size: 26px; color: var(--ink); }
</style></head>
<body><div class="frame">
  <div class="abs q">How does it work?</div>
  <svg class="abs" style="left:0;top:0" width="1280" height="720">
    <g fill="none" stroke="var(--dim)" stroke-width="3" marker-end="url(#a)">
      <path d="M306 330 H 520"/><path d="M730 330 H 944"/><path d="M1044 390 V 470 H 404 V 400" stroke-dasharray="8 8"/>
    </g>
    <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--dim)"/></marker></defs>
  </svg>
  <div class="abs node dim" style="left:104px;top:275px"><span class="num">1</span>Input</div>
  <div class="abs node on" style="left:526px;top:275px"><span class="num">2</span>Process</div>
  <div class="abs node" style="left:950px;top:275px"><span class="num">3</span>Result</div>
  <div class="abs take">So what: each part has one job, and the loop makes it better every time.</div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: var(--bg); }
  .print { left: 330px; top: 60px; width: 620px; height: 470px; padding: 26px 26px 80px; background: var(--ink); transform: rotate(-1.5deg); box-shadow: 0 14px 30px color-mix(in srgb, var(--ink) 40%, transparent); }
  .photo { position: relative; width: 100%; height: 100%; background: linear-gradient(180deg, color-mix(in srgb, var(--r4) 55%, var(--bg)) 0 55%, color-mix(in srgb, var(--raised) 80%, var(--bg)) 55%); overflow: hidden; }
  .photo svg { position: absolute; inset: 0; }
  .tape { left: 600px; top: 36px; width: 120px; height: 34px; background: color-mix(in srgb, var(--r4) 60%, transparent); transform: rotate(3deg); }
  .grain { inset: 0; filter: url(#g); opacity: .2; mix-blend-mode: overlay; background: var(--ink); }
  .vig { inset: 0; background: radial-gradient(ellipse at center, transparent 45%, color-mix(in srgb, var(--bg) 85%, transparent) 100%); }
  .cap { left: 290px; top: 590px; width: 700px; padding: 12px 20px; background: var(--ink); color: var(--bg); font-family: var(--mono); font-size: 32px; letter-spacing: .04em; }
  .stamp { left: 960px; top: 110px; padding: 6px 14px; border: 3px solid var(--accent); color: var(--accent); font-family: var(--mono); font-size: 30px; font-weight: 700; transform: rotate(6deg); }
  .brand { left: 30px; top: 30px; font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
</style></head>
<body><div class="frame">
  <svg width="0" height="0" style="position:absolute"><defs><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter></defs></svg>
  <div class="abs print"><div class="photo">
    <svg viewBox="0 0 568 364" preserveAspectRatio="none"><path d="M0 250 L90 190 L170 235 L290 140 L420 230 L500 180 L568 220 V364 H0z" fill="var(--raised)"/><circle cx="440" cy="80" r="38" fill="var(--bg)" opacity=".7"/><rect x="250" y="210" width="70" height="110" fill="var(--ink)" opacity=".6"/><circle cx="285" cy="190" r="22" fill="var(--ink)" opacity=".6"/></svg>
  </div></div>
  <div class="abs tape"></div>
  <div class="abs stamp">1987</div>
  <div class="abs cap">It started in a small garage.</div>
  <div class="abs grain"></div><div class="abs vig"></div>
  <div class="abs brand"><span data-brand="name"></span></div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  .stage { display: grid; grid-template-columns: 330px 330px 330px; gap: 40px; padding: 30px 110px; height: 720px; align-items: center; background: var(--bg); }
  .ph { position: relative; width: 330px; height: 587px; overflow: hidden; border-radius: 18px; }
  .h { font-family: var(--head); font-weight: 900; line-height: 1.08; letter-spacing: -0.02em; }
  .mk { position: absolute; font-family: var(--mono); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
</style></head>
<body><div class="frame"><div class="stage">
  <div class="ph" style="background:var(--bg);outline:1px solid var(--line)">
    <div class="mk" style="left:28px;top:60px;color:var(--faint)">01 / Hook</div>
    <div class="abs h" style="left:28px;top:190px;font-size:66px;color:var(--ink)">Save<br><span style="background:var(--accent);color:var(--bg);padding:0 8px">10 hours</span><br>a week</div>
    <div class="abs" style="left:28px;bottom:210px;width:120px;height:6px;background:var(--accent)"></div></div>
  <div class="ph" style="background:var(--ink)">
    <div class="mk" style="left:28px;top:60px;color:var(--dim)">02 / Why</div>
    <div class="abs h" style="left:28px;top:170px;font-size:88px;color:var(--bg)">3<br>steps</div>
    <div class="abs" style="right:-50px;top:360px;width:260px;height:260px;border-radius:50%;background:var(--accent)"></div>
    <div class="mk" style="left:28px;bottom:60px;color:var(--bg)" data-brand="name"></div></div>
  <div class="ph" style="background:var(--bg);outline:1px solid var(--line)">
    <div class="mk" style="left:28px;top:60px;color:var(--faint)">03 / Do it</div>
    <div class="abs h" style="left:28px;top:210px;font-size:84px;color:var(--ink)">Start<br>today.</div>
    <div class="abs" style="left:28px;top:430px;padding:16px 28px;background:var(--accent);color:var(--bg);font-family:var(--head);font-weight:800;font-size:28px;border-radius:40px">Follow</div></div>
</div></div></body></html>

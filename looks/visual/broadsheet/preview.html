<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
body{background:var(--bg)}
.mast{left:70px;right:70px;top:40px;text-align:center;font-family:var(--head),serif;font-weight:800;font-size:58px;color:var(--ink);border-top:4px double var(--ink);border-bottom:4px double var(--ink);padding:10px 0}
.date{left:70px;right:70px;top:150px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--ink);padding-bottom:8px}

.q{left:880px;top:470px;width:330px;font-family:var(--head),serif;font-style:italic;font-size:28px;color:var(--ink);border-top:2px solid var(--ink);padding-top:10px}
.ring{left:56px;top:285px;width:380px;height:100px;border:5px solid var(--danger);border-radius:50%}
.vr{top:470px;width:1px;height:200px;background:var(--ink)}

<div class="abs ring"></div>
<div class="abs col" style="left:70px;top:470px;height:190px"></div><div class="abs vr" style="left:320px"></div>

<div class="abs col" style="left:610px;top:470px;height:190px"></div>
<div class="abs photo"></div>

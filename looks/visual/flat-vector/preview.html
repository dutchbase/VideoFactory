<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: var(--bg); }

  .n { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--head); font-weight: 800; font-size: 24px; color: var(--bg); }
  .cap { right: 48px; bottom: 36px; font-family: var(--mono); font-size: 14px; color: var(--faint); letter-spacing: .1em; text-transform: uppercase; }
</style></head>

    <path d="M914 236 Q930 250 946 236" stroke="var(--ink)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="1000" y="290" width="110" height="34" rx="17" fill="var(--accent)" transform="rotate(-30 1000 307)"/>
    <circle cx="1130" cy="150" r="34" fill="var(--r4)"/><circle cx="700" cy="200" r="22" fill="var(--r6)"/>

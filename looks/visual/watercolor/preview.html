<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: var(--bg); }
  .blob { border-radius: 52% 48% 55% 45% / 48% 56% 44% 52%; filter: url(#rough); }
  .b1 { left: 640px; top: 70px; width: 480px; height: 440px; background: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: inset 0 0 0 6px color-mix(in srgb, var(--accent) 60%, transparent); }
  .b2 { left: 860px; top: 280px; width: 360px; height: 340px; background: color-mix(in srgb, var(--accent2) 65%, transparent); box-shadow: inset 0 0 0 6px color-mix(in srgb, var(--accent2) 55%, transparent); }
  .b3 { left: 560px; top: 340px; width: 300px; height: 280px; background: color-mix(in srgb, var(--green) 60%, transparent); box-shadow: inset 0 0 0 5px color-mix(in srgb, var(--green) 30%, transparent); }
  .b4 { left: 40px; top: 560px; width: 380px; height: 200px; background: color-mix(in srgb, var(--r3) 55%, transparent); }
  .grain { inset: 0; filter: url(#grain); opacity: .08; background: var(--ink); }
  .h { left: 64px; top: 190px; width: 640px; font-family: var(--head); font-weight: 600; font-size: 108px; line-height: 1; letter-spacing: -0.02em; color: var(--ink); }
  .note { left: 70px; top: 120px; font-family: var(--hand), cursive; font-size: 34px; color: var(--dim); }
  .brand { left: 70px; top: 650px; font-family: var(--mono); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
</style></head>
<body><div class="frame">
  <svg width="0" height="0" style="position:absolute"><defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="34"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs></svg>
  <div class="abs blob b1"></div><div class="abs blob b2"></div><div class="abs blob b3"></div><div class="abs blob b4"></div>
  <svg class="abs" style="left:560px;top:90px" width="640" height="520" viewBox="0 0 640 520" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"><path d="M70 300 C100 120 300 60 420 150 C540 240 470 430 300 440 C160 450 60 400 70 300z"/><path d="M200 250 q60 -50 120 0"/><circle cx="250" cy="230" r="6" fill="var(--ink)"/><circle cx="330" cy="230" r="6" fill="var(--ink)"/></svg>
  <div class="abs note">a small idea</div>
  <div class="abs h">Start small, grow slow</div>
  <div class="abs grain"></div>
  <div class="abs brand"><span data-brand="name"></span></div>
</div></body></html>

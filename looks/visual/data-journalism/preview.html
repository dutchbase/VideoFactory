<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  .h { left: 96px; top: 70px; width: 900px; font-family: var(--head); font-weight: 700; font-size: 50px; line-height: 1.08; color: var(--ink); }
  .sub { left: 96px; top: 196px; font-family: var(--mono); font-size: 16px; color: var(--faint); letter-spacing: .04em; }
  svg { left: 96px; top: 240px; }
  .ax { font-family: var(--mono); font-size: 14px; fill: var(--faint); }
  .note { font-family: var(--font); font-size: 20px; fill: var(--ink); font-weight: 600; }
  .src { left: 96px; top: 660px; font-family: var(--mono); font-size: 14px; color: var(--faint); }
  .brand { right: 96px; top: 660px; font-family: var(--mono); font-size: 14px; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; }
</style></head>
<body><div class="frame">
  <div class="abs h">Remote teams grew three times faster than office teams</div>
  <div class="abs sub">Team size index, 2019 = 100</div>
  <svg class="abs" width="1090" height="400" viewBox="0 0 1090 400">
    <g stroke="var(--line)" stroke-width="1">
      <line x1="40" y1="40" x2="1060" y2="40"/><line x1="40" y1="130" x2="1060" y2="130"/>
      <line x1="40" y1="220" x2="1060" y2="220"/><line x1="40" y1="310" x2="1060" y2="310" stroke="var(--faint)"/>
    </g>
    <text class="ax" x="0" y="45">300</text><text class="ax" x="0" y="135">200</text><text class="ax" x="0" y="225">150</text><text class="ax" x="0" y="315">100</text>
    <text class="ax" x="40" y="340">2019</text><text class="ax" x="300" y="340">2020</text><text class="ax" x="560" y="340">2021</text><text class="ax" x="820" y="340">2022</text><text class="ax" x="1010" y="340">2023</text>
    <polyline fill="none" stroke="var(--faint)" stroke-width="2" points="40,310 300,300 560,290 820,280 1040,262"/>
    <polyline fill="none" stroke="var(--faint)" stroke-width="2" opacity=".6" points="40,310 300,318 560,296 820,300 1040,288"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="4" points="40,310 300,250 560,180 820,110 1040,60"/>
    <circle cx="1040" cy="60" r="9" fill="var(--accent)"/>
    <line x1="1040" y1="60" x2="900" y2="20" stroke="var(--dim)" stroke-width="1"/>
    <text class="note" x="700" y="18">Remote: +190%</text>
    <text class="ax" x="1046" y="266">Office</text>
  </svg>
  <div class="abs src">Source: example data for the preview</div>
  <div class="abs brand" data-brand="name"></div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  .ttl { left: 90px; top: 130px; font-family: var(--head); font-weight: 700; font-size: 100px; line-height: 1.05; letter-spacing: .03em; color: var(--ink); }
  .tag { font-family: var(--mono); font-size: 15px; color: var(--faint); letter-spacing: .1em; }
</style></head>
<body><div class="frame" style="background:var(--bg)">
  <div class="abs" style="left:640px;top:200px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--accent2) 55%, transparent), transparent 65%)"></div>
  <svg class="abs" style="left:0;top:0" width="1280" height="720" viewBox="0 0 1280 720">

    <circle cx="930" cy="330" r="74" fill="var(--accent2)"/>
    <path d="M0 400 Q250 320 520 390 T1280 360 V720 H0Z" fill="var(--r1)" filter="url(#sh)"/>
    <path d="M0 470 Q300 410 640 470 T1280 450 V720 H0Z" fill="var(--r2)" stroke="var(--accent)" stroke-width="2" filter="url(#sh)"/>
    <path d="M860 470 l40 -130 l40 130Z" fill="var(--bg)"/>
    <path d="M-20 600 Q300 540 640 610 T1300 580 V740 H-20Z" fill="var(--bg)" filter="url(#b1)"/>
    <circle cx="260" cy="240" r="5" fill="var(--accent2)" opacity=".6"/><circle cx="520" cy="300" r="4" fill="var(--accent2)" opacity=".5"/><circle cx="760" cy="200" r="3" fill="var(--accent2)" opacity=".7"/>

  <div class="abs ttl">One light.<br>One story.</div>
  <div class="abs tag" style="right:50px;bottom:34px" data-brand="name"></div>
</div></body></html>

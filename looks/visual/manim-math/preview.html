<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: var(--bg); }
  svg { position: absolute; left: 0; top: 0; }
  .eq { left: 64px; top: 60px; font-family: var(--font), serif; font-size: 76px; font-style: italic; color: var(--ink); letter-spacing: .02em; }
  .eq .a { color: var(--accent); } .eq .b { color: var(--accent2); } .eq .c { color: var(--r4); }
  .cap { left: 68px; top: 190px; width: 420px; font-family: var(--font); font-size: 30px; line-height: 1.35; color: var(--dim); }
  .lab { font-family: var(--font), serif; font-style: italic; font-size: 34px; }
  .tag { right: 44px; top: 40px; font-family: var(--mono); font-size: 16px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }
</style></head>
<body><div class="frame">
  <svg width="1280" height="720" viewBox="0 0 1280 720">
    <g stroke="var(--line)" stroke-width="1" opacity=".6">
      <line x1="520" y1="120" x2="520" y2="680"/><line x1="620" y1="120" x2="620" y2="680"/><line x1="720" y1="120" x2="720" y2="680"/><line x1="820" y1="120" x2="820" y2="680"/><line x1="920" y1="120" x2="920" y2="680"/><line x1="1020" y1="120" x2="1020" y2="680"/><line x1="1120" y1="120" x2="1120" y2="680"/>
      <line x1="460" y1="180" x2="1200" y2="180"/><line x1="460" y1="280" x2="1200" y2="280"/><line x1="460" y1="380" x2="1200" y2="380"/><line x1="460" y1="480" x2="1200" y2="480"/><line x1="460" y1="580" x2="1200" y2="580"/>
    </g>
    <g stroke="var(--dim)" stroke-width="3" stroke-linecap="round"><line x1="460" y1="530" x2="1200" y2="530"/><line x1="620" y1="130" x2="620" y2="680"/></g>
    <path d="M 700 530 L 700 380 L 920 380 L 920 530 Z" fill="color-mix(in srgb, var(--accent2) 22%, transparent)" stroke="none"/>
    <path d="M 480 640 C 600 640, 640 540, 760 400 C 860 290, 960 240, 1150 200" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 480 520 C 620 500, 760 470, 900 390 C 1000 330, 1090 320, 1150 330" fill="none" stroke="var(--accent2)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
    <line x1="760" y1="400" x2="760" y2="530" stroke="var(--r4)" stroke-width="3" stroke-dasharray="8 8"/>
    <line x1="620" y1="400" x2="760" y2="400" stroke="var(--r4)" stroke-width="3" stroke-dasharray="8 8"/>
    <circle cx="760" cy="400" r="11" fill="var(--r4)"/>
    <circle cx="760" cy="400" r="22" fill="none" stroke="var(--r4)" stroke-width="2" opacity=".6"/>
    <g stroke="var(--dim)" stroke-width="2"><line x1="720" y1="524" x2="720" y2="536"/><line x1="820" y1="524" x2="820" y2="536"/><line x1="920" y1="524" x2="920" y2="536"/><line x1="614" y1="480" x2="626" y2="480"/><line x1="614" y1="380" x2="626" y2="380"/><line x1="614" y1="280" x2="626" y2="280"/></g>
    <text x="780" y="565" class="lab" fill="var(--r4)">x</text>
    <text x="1060" y="190" class="lab" fill="var(--accent)">f(x)</text>
  </svg>
  <div class="abs eq"><span class="a">f</span>(<span class="c">x</span>) = <span class="b">x</span>² + 1</div>
  <div class="abs cap">Each step grows faster than the last.</div>
  <div class="abs tag"><span data-brand="name"></span></div>
</div></body></html>

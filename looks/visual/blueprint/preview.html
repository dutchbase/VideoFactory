<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: var(--bg); }
  .grid { inset: 0; background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--line) 45%, transparent) 0 1px, transparent 1px 24px), repeating-linear-gradient(0deg, color-mix(in srgb, var(--line) 45%, transparent) 0 1px, transparent 1px 24px); }
  .major { inset: 0; background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--line) 90%, transparent) 0 1px, transparent 1px 120px), repeating-linear-gradient(0deg, color-mix(in srgb, var(--line) 90%, transparent) 0 1px, transparent 1px 120px); }
  svg { left: 0; top: 0; }
  .h { left: 72px; top: 70px; font-family: var(--head); font-weight: 700; font-size: 88px; line-height: 1; color: var(--ink); letter-spacing: -0.02em; }
  .lab { font-family: var(--mono); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .tb { right: 56px; bottom: 48px; width: 300px; border: 2px solid var(--ink); padding: 12px 16px; background: color-mix(in srgb, var(--surface) 80%, transparent); }
</style></head>
<body><div class="frame">
  <div class="abs grid"></div><div class="abs major"></div>
  <svg class="abs" width="1280" height="720" fill="none" stroke-width="2">
    <g stroke="var(--ink)">
      <rect x="560" y="250" width="300" height="240" fill="color-mix(in srgb, var(--surface) 70%, transparent)"/>
      <circle cx="710" cy="370" r="70"/>
      <circle cx="710" cy="370" r="28"/>
      <rect x="470" y="330" width="90" height="80"/>
      <rect x="860" y="330" width="90" height="80"/>
    </g>
    <g stroke="var(--accent)" stroke-width="3"><circle cx="710" cy="370" r="46" stroke-dasharray="10 8"/></g>
    <g stroke="var(--dim)" stroke-width="1.5">
      <line x1="560" y1="540" x2="860" y2="540"/><line x1="560" y1="528" x2="560" y2="552"/><line x1="860" y1="528" x2="860" y2="552"/>
      <line x1="1000" y1="250" x2="1000" y2="490"/><line x1="988" y1="250" x2="1012" y2="250"/><line x1="988" y1="490" x2="1012" y2="490"/>
      <polyline points="710,300 780,200 980,200"/>
      <polyline points="515,330 440,240 340,240"/>
    </g>
    <circle cx="710" cy="300" r="5" fill="var(--accent)" stroke="none"/><circle cx="515" cy="330" r="5" fill="var(--accent)" stroke="none"/>
  </svg>
  <div class="abs lab" style="left:700px;top:172px;color:var(--accent)">A-01 Core</div>
  <div class="abs lab" style="left:300px;top:212px">B-02 Input</div>
  <div class="abs lab" style="left:660px;top:556px">300 mm</div>
  <div class="abs lab" style="left:1020px;top:360px">240 mm</div>
  <div class="abs h">How it works</div>
  <div class="abs tb"><div class="lab" style="color:var(--ink)">Step 01 / 03</div><div class="lab" style="margin-top:6px"><span data-brand="name"></span> — Sheet 1</div></div>
</div></body></html>

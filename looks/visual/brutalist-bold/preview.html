<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: var(--bg); }
  .cell { border: 6px solid var(--ink); }
  .big { left: 0; top: 0; width: 820px; height: 720px; background: var(--accent); overflow: hidden; }
  .h { position: absolute; left: 28px; top: 40px; font-family: var(--head); font-weight: 900; font-size: 250px; line-height: .85; letter-spacing: -0.04em; text-transform: uppercase; color: var(--ink); }
  .c2 { left: 814px; top: 0; width: 466px; height: 300px; background: var(--accent2); }
  .card { left: 860px; top: 340px; width: 360px; height: 230px; background: var(--surface); box-shadow: 14px 14px 0 var(--ink); padding: 22px; }
  .card b { display: block; font-family: var(--head); font-weight: 900; font-size: 64px; line-height: .95; text-transform: uppercase; color: var(--ink); }
  .tag { left: 846px; top: 40px; padding: 8px 14px; background: var(--bg); font-family: var(--mono); font-size: 20px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  .tick { left: 0; bottom: 0; width: 1280px; height: 64px; background: var(--ink); color: var(--bg); font-family: var(--mono); font-size: 24px; line-height: 64px; white-space: nowrap; letter-spacing: .1em; text-transform: uppercase; }
  .c3 { left: 814px; top: 290px; width: 466px; height: 12px; border: 0; }
</style></head>
<body><div class="frame">
  <div class="abs cell big"><div class="h">Stop<br>wasting<br>time.</div></div>
  <div class="abs cell c2"></div>
  <div class="abs tag cell">New — <span data-brand="name"></span></div>
  <div class="abs cell card"><b>Save 10 hours a week</b></div>
  <div class="abs tick">&nbsp;Save 10 hours a week // Save 10 hours a week // Save 10 hours a week // Save</div>
</div></body></html>

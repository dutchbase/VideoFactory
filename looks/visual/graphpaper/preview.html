<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
body{background:var(--bg)}
.dots{inset:0;background-image:radial-gradient(color-mix(in srgb,var(--line) 100%,transparent) 2px,transparent 2.5px);background-size:28px 28px}
.h{left:80px;top:70px;font-family:var(--head);font-weight:800;font-size:72px;color:var(--ink)}
.hl{left:74px;top:132px;width:300px;height:36px;background:color-mix(in srgb,var(--r4) 70%,transparent)}
.c{width:300px;height:190px;background:var(--surface);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:22px;font-family:var(--head);font-size:30px;font-weight:700;color:var(--ink)}
.n{font-family:var(--mono);font-size:18px;color:var(--accent);display:block;margin-bottom:10px}
.brand{right:80px;bottom:40px;font-family:var(--mono);font-size:14px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}

<body><div class="frame">
<div class="abs dots"></div><div class="abs hl"></div>
<div class="abs h">3 simple steps</div>
<div class="abs c" style="left:80px;top:290px"><span class="n">01</span>Write it down</div>
<div class="abs c" style="left:490px;top:290px"><span class="n">02</span>Test it</div>
<div class="abs c" style="left:900px;top:290px"><span class="n">03</span>Ship it</div>
<svg class="abs" style="left:0;top:0" width="1280" height="720"><g fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"><path d="M390 385 Q440 350 480 385"/><path d="M475 372 L482 386 L466 388"/><path d="M800 385 Q850 350 890 385"/><path d="M885 372 L892 386 L876 388"/></g>
<path d="M80 560 Q300 580 520 556" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></svg>
<div class="abs brand" data-brand="name"></div>
</div></body></html>

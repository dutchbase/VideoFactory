<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: var(--bg); }
  .grid { inset: 0; background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--line) 60%, transparent) 0 1px, transparent 1px 98.66px); opacity: .55; }
  .circle { left: 780px; top: 96px; width: 330px; height: 330px; border-radius: 50%; background: var(--accent); }
  .bar { left: 682px; top: 470px; width: 520px; height: 64px; background: var(--accent2); }
  .quarter { left: 978px; top: 496px; width: 224px; height: 224px; background: var(--r4); border-top-left-radius: 100%; }
  .tri { left: 682px; top: 226px; width: 0; height: 0; border-left: 98px solid transparent; border-right: 98px solid transparent; border-bottom: 170px solid var(--ink); }
  .idx { left: 64px; top: 72px; font-family: var(--mono); font-size: 16px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }
  .h { left: 60px; top: 150px; font-family: var(--head); font-weight: 800; font-size: 136px; line-height: .9; letter-spacing: -0.03em; color: var(--ink); }
  .cap { left: 64px; top: 600px; width: 420px; font-family: var(--mono); font-size: 16px; line-height: 1.5; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
  .rule { left: 64px; top: 570px; width: 560px; height: 4px; background: var(--ink); }
</style></head>
<body><div class="frame">
  <div class="abs grid"></div>
  <div class="abs circle"></div>
  <div class="abs tri"></div>
  <div class="abs bar"></div>
  <div class="abs quarter"></div>
  <div class="abs idx">01 — <span data-brand="name"></span></div>
  <div class="abs h">Form<br>follows<br>function.</div>
  <div class="abs rule"></div>
  <div class="abs cap">Three parts. One system. Every edge on the grid.</div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: linear-gradient(180deg, var(--bg), color-mix(in srgb, var(--accent2) 12%, var(--bg))); }
  svg { position: absolute; left: 0; top: 0; }
  .h { left: 64px; top: 90px; font-family: var(--head); font-weight: 900; font-size: 112px; line-height: .95; letter-spacing: -.02em; color: var(--ink); }
  .sub { left: 68px; top: 330px; font-family: var(--mono); font-size: 20px; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
  .tag { left: 68px; top: 640px; font-family: var(--mono); font-size: 16px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }
</style></head>
<body><div class="frame">
  <svg width="1280" height="720" viewBox="0 0 1280 720">
    <polygon points="440,640 700,430 980,640" fill="color-mix(in srgb, var(--accent2) 60%, var(--bg))"/>
    <polygon points="700,430 980,640 800,640" fill="color-mix(in srgb, var(--accent2) 80%, var(--ink))"/>
    <polygon points="620,640 860,380 1100,640" fill="var(--accent2)"/>
    <polygon points="860,380 1100,640 960,640" fill="color-mix(in srgb, var(--accent2) 70%, var(--bg))"/>
    <polygon points="860,380 760,500 800,640 620,640" fill="color-mix(in srgb, var(--accent2) 75%, var(--ink))"/>
    <polygon points="860,380 830,430 880,450" fill="var(--ink)"/>
    <polygon points="860,380 880,450 940,470 910,420" fill="color-mix(in srgb, var(--ink) 70%, var(--accent2))"/>
    <polygon points="420,640 560,500 700,640" fill="var(--r4)"/>
    <polygon points="560,500 700,640 600,640" fill="color-mix(in srgb, var(--r4) 70%, var(--accent))"/>
    <polygon points="880,160 960,100 1040,160 960,260" fill="var(--accent)"/>
    <polygon points="880,160 960,260 920,200" fill="color-mix(in srgb, var(--accent) 80%, var(--ink))"/>
    <polygon points="960,100 1040,160 1000,150" fill="color-mix(in srgb, var(--accent) 60%, var(--ink))"/>
    <polygon points="1040,160 960,260 990,190" fill="color-mix(in srgb, var(--accent) 70%, var(--bg))"/>
    <polygon points="960,100 880,160 920,170" fill="color-mix(in srgb, var(--ink) 40%, var(--accent))"/>
    <polygon points="300,640 360,570 420,640" fill="color-mix(in srgb, var(--green) 70%, var(--bg))"/>
    <polygon points="360,570 420,640 380,640" fill="var(--green)"/>
    <polygon points="1080,640 1130,580 1180,640" fill="color-mix(in srgb, var(--green) 70%, var(--bg))"/>
    <polygon points="1130,580 1180,640 1150,640" fill="var(--green)"/>
    <rect x="0" y="640" width="1280" height="80" fill="color-mix(in srgb, var(--accent2) 35%, var(--bg))"/>
    <polygon points="0,640 200,640 100,720 0,720" fill="color-mix(in srgb, var(--accent2) 28%, var(--bg))"/>
    <polygon points="400,640 640,640 520,720 360,720" fill="color-mix(in srgb, var(--accent2) 28%, var(--bg))"/>
    <polygon points="900,640 1180,640 1080,720 840,720" fill="color-mix(in srgb, var(--accent2) 28%, var(--bg))"/>
  </svg>
  <div class="abs h">Peak<br>results.</div>
  <div class="abs sub">3 steps to the top</div>
  <div class="abs tag"><span data-brand="name"></span></div>
</div></body></html>

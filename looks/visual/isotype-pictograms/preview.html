<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: var(--bg); }
  .title { left: 64px; top: 48px; font-family: var(--head); font-weight: 800; font-size: 72px; letter-spacing: -0.02em; color: var(--ink); }
  .key { left: 64px; top: 140px; font-family: var(--mono); font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .row { left: 64px; width: 1152px; height: 140px; border-bottom: 3px solid var(--line); }
  .lab { position: absolute; left: 0; top: 34px; font-family: var(--head); font-weight: 700; font-size: 38px; color: var(--ink); width: 220px; line-height: 1; }
  .lab small { display: block; margin-top: 8px; font-family: var(--mono); font-weight: 400; font-size: 15px; color: var(--dim); letter-spacing: .1em; }
  .icons { position: absolute; left: 230px; top: 14px; display: flex; gap: 8px; }
  svg { width: 74px; height: 112px; flex: none; }
  .half { width: 37px; overflow: hidden; display: block; }
  .half svg { display: block; }
  .num { position: absolute; right: -10px; top: 30px; font-family: var(--head); font-weight: 800; font-size: 72px; color: var(--ink); }
</style></head>

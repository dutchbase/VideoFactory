<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: linear-gradient(180deg, var(--bg), color-mix(in srgb, var(--accent2) 14%, var(--bg))); }
  .p { border-radius: 50%; }
  .shadow { height: 40px; border-radius: 50%; background: color-mix(in srgb, var(--faint) 50%, transparent); filter: blur(16px); }
  .sphere { left: 220px; top: 190px; width: 300px; height: 300px; background: radial-gradient(circle at 30% 26%, color-mix(in srgb, var(--accent) 45%, var(--ink) 55%) 0%, color-mix(in srgb, var(--accent) 80%, var(--ink)) 8%, var(--accent) 50%, color-mix(in srgb, var(--accent) 55%, var(--bg)) 100%); box-shadow: inset -26px -32px 60px color-mix(in srgb, var(--bg) 45%, transparent), inset 16px 18px 36px color-mix(in srgb, var(--ink) 22%, transparent); }
  .cube { left: 600px; top: 330px; width: 230px; height: 230px; border-radius: 60px; background: radial-gradient(circle at 28% 24%, color-mix(in srgb, var(--accent2) 60%, var(--ink) 40%), var(--accent2) 50%, color-mix(in srgb, var(--accent2) 55%, var(--bg))); box-shadow: inset -22px -26px 50px color-mix(in srgb, var(--bg) 45%, transparent), inset 14px 16px 30px color-mix(in srgb, var(--ink) 20%, transparent); transform: rotate(-9deg); }
  .pill { left: 880px; top: 170px; width: 300px; height: 130px; border-radius: 70px; background: radial-gradient(circle at 25% 25%, color-mix(in srgb, var(--r4) 60%, var(--ink) 40%), var(--r4) 50%, color-mix(in srgb, var(--r4) 55%, var(--bg))); box-shadow: inset -18px -20px 40px color-mix(in srgb, var(--bg) 45%, transparent); transform: rotate(8deg); }
  .torus { left: 950px; top: 400px; width: 190px; height: 190px; border: 52px solid var(--green); box-shadow: inset -8px -10px 18px color-mix(in srgb, var(--bg) 40%, transparent), 10px 14px 24px color-mix(in srgb, var(--faint) 40%, transparent); }
  .mini { width: 70px; height: 70px; background: radial-gradient(circle at 30% 28%, color-mix(in srgb, var(--accent) 50%, var(--ink) 50%), var(--accent) 55%, color-mix(in srgb, var(--accent) 55%, var(--bg))); box-shadow: inset -8px -10px 16px color-mix(in srgb, var(--bg) 40%, transparent); }
  .h { left: 64px; top: 560px; font-family: var(--head); font-weight: 800; font-size: 72px; line-height: 1; color: var(--ink); }
  .sub { left: 68px; top: 650px; font-family: var(--font); font-size: 26px; color: var(--dim); }
  .tag { right: 44px; top: 40px; font-family: var(--mono); font-size: 16px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }
</style></head>
<body><div class="frame">
  <div class="abs shadow" style="left:200px;top:520px;width:340px"></div>
  <div class="abs shadow" style="left:590px;top:560px;width:260px"></div>
  <div class="abs shadow" style="left:900px;top:300px;width:260px;opacity:.5"></div>
  <div class="abs p sphere"></div><div class="abs cube"></div><div class="abs pill"></div>
  <div class="abs p torus"></div>
  <div class="abs p mini" style="left:560px;top:150px"></div><div class="abs p mini" style="left:760px;top:240px;width:44px;height:44px"></div>
  <div class="abs h">3 simple steps</div>
  <div class="abs sub">Soft, round and easy to follow.</div>
  <div class="abs tag"><span data-brand="name"></span></div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: var(--bg); }
  .h { left: 72px; top: 70px; font-family: var(--head); font-weight: 700; font-size: 80px; line-height: 1; color: var(--ink); letter-spacing: -0.02em; }
  .lab { font-family: var(--mono); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .t { fill: var(--r5); } .l { fill: var(--r3); } .r { fill: var(--r2); }
  .ta { fill: var(--accent); } .la { fill: color-mix(in srgb, var(--accent) 70%, var(--ink)); } .ra { fill: color-mix(in srgb, var(--accent) 50%, var(--ink)); }
</style></head>
<body><div class="frame">
  <svg class="abs" width="1280" height="720" style="left:0;top:0">
    <polygon points="700,300 960,430 700,560 440,430" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
    <ellipse cx="560" cy="470" rx="70" ry="22" fill="var(--ink)" opacity=".12"/>
    <polygon class="t" points="560,370 620,400 560,430 500,400"/><polygon class="l" points="500,400 560,430 560,490 500,460"/><polygon class="r" points="560,430 620,400 620,460 560,490"/>
    <polygon class="t" points="840,380 900,410 840,440 780,410"/><polygon class="l" points="780,410 840,440 840,500 780,470"/><polygon class="r" points="840,440 900,410 900,470 840,500"/>
    <polygon class="ta" points="700,260 780,300 700,340 620,300"/><polygon class="la" points="620,300 700,340 700,420 620,380"/><polygon class="ra" points="700,340 780,300 780,380 700,420"/>
    <polyline points="620,440 700,480 780,440" fill="none" stroke="var(--accent2)" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>
    <polygon points="700,468 716,476 700,484 684,476" fill="var(--accent2)"/>
  </svg>
  <div class="abs h">3 steps</div>
  <div class="abs lab" style="left:650px;top:206px;color:var(--accent)">Core</div>
  <div class="abs lab" style="left:72px;top:640px">Isometric board — <span data-brand="name"></span></div>
</div></body></html>

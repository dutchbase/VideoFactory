<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
body{background:var(--bg)}
.p{left:60px;top:50px;width:1160px;height:620px;border:14px solid var(--ink);background:var(--surface);overflow:hidden}
.dots{inset:0;background-image:radial-gradient(var(--accent2) 28%,transparent 30%);background-size:18px 18px;-webkit-mask-image:linear-gradient(120deg,transparent 30%,var(--ink));mask-image:linear-gradient(120deg,transparent 30%,var(--ink));opacity:.8}
.cap{left:90px;top:80px;background:var(--r4);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:12px 22px;font-family:var(--head);font-weight:800;font-size:30px;color:var(--ink);text-transform:uppercase}
.h{left:110px;top:230px;font-family:var(--head);font-weight:900;font-size:130px;line-height:.95;text-transform:uppercase;color:var(--ink);-webkit-text-stroke:3px var(--ink);letter-spacing:-.01em}
.h span{color:var(--accent)}
.brand{right:100px;bottom:80px;font-family:var(--mono);font-size:14px;color:var(--ink);text-transform:uppercase;letter-spacing:.1em}
</style></head>
<body><div class="frame">
<div class="abs p"><div class="abs dots"></div></div>
<svg class="abs" style="left:0;top:0" width="1280" height="720"><polygon points="940,120 985,200 1075,170 1050,255 1140,290 1050,330 1085,430 990,395 940,470 905,390 810,420 850,330 770,285 855,250 830,160 905,195" fill="var(--accent)" stroke="var(--ink)" stroke-width="8" stroke-linejoin="round"/></svg>
<div class="abs cap">Think it costs a lot?</div>
<div class="abs h">Not<br><span>really!</span></div>
<div class="abs" style="left:866px;top:268px;font-family:var(--head);font-weight:900;font-size:62px;color:var(--ink);text-transform:uppercase;transform:rotate(-6deg)">Pow!</div>
<div class="abs brand" data-brand="name"></div>
</div></body></html>

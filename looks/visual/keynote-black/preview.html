<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_runtime/preview.css">
<script src="../../_runtime/preview.js"></script>
<style>
  body { background: var(--bg); }
  .vig { inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 35%, color-mix(in srgb, var(--bg) 85%, black) 100%); }
  .pool { left: 340px; top: 350px; width: 600px; height: 280px; background: radial-gradient(ellipse, color-mix(in srgb, var(--accent2) 28%, transparent), transparent 70%); }
  .obj { left: 490px; top: 130px; width: 300px; height: 300px; border-radius: 70px; background: linear-gradient(145deg, var(--raised), var(--bg)); border: 1.5px solid color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: -14px -6px 50px color-mix(in srgb, var(--accent) 40%, transparent), 0 30px 60px color-mix(in srgb, var(--bg) 80%, black); }
  .core { left: 590px; top: 230px; width: 100px; height: 100px; border-radius: 50%; background: var(--accent); filter: blur(1px); box-shadow: 0 0 60px var(--accent); }
  .h { left: 0; width: 1280px; text-align: center; top: 480px; font-family: var(--head); font-weight: 600; font-size: 84px; color: var(--ink); letter-spacing: -0.02em; }
  .s { left: 0; width: 1280px; text-align: center; top: 590px; font-size: 28px; color: var(--dim); filter: blur(1.2px); }
  .b { right: 48px; bottom: 36px; font-family: var(--mono); font-size: 13px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }
</style></head>
<body><div class="frame">
  <div class="abs pool"></div>
  <div class="abs obj"></div><div class="abs core"></div>
  <div class="abs h">Meet the new way.</div>
  <div class="abs s">Simple. Fast. Yours.</div>
  <div class="abs vig"></div>
  <div class="abs b" data-brand="name"></div>
</div></body></html>
